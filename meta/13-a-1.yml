SDG_INDICATOR__GLOBAL: >-
  <p>Indicator 13.a.1: Amounts provided and mobilized in United States dollars
  per year in relation to the continued existing collective mobilization goal of
  the $100 billion commitment through to 2025</p>
SDG_TARGET__GLOBAL: >-
  <p>Target 13.a: Implement the commitment undertaken by developed-country
  parties to the United Nations Framework Convention on Climate Change to a goal
  of mobilizing jointly $100 billion annually by 2020 from all sources to
  address the needs of developing countries in the context of meaningful
  mitigation actions and transparency on implementation and fully operationalize
  the Green Climate Fund through its capitalization as soon as possible</p>
META_LAST_UPDATE__GLOBAL: <p>2021-03-01</p>
SDG_CUSTODIAN_AGENCIES__GLOBAL: <p>UN Climate Change (UNFCCC Secretariat)</p>
